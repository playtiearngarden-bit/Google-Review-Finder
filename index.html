<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google Review Finder</title>
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Review Finder">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f1f5f9;color:#202124;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#fff;width:100%;max-width:460px;border-radius:16px;padding:26px 22px;box-shadow:0 12px 32px rgba(0,0,0,.12)}
h1{font-size:1.2rem;margin-bottom:4px;display:flex;align-items:center;gap:8px}
h1 img{width:34px;height:34px;object-fit:contain}
.big{display:block;width:84px;height:84px;object-fit:contain;margin:0 auto 12px}
.chk{display:flex;align-items:center;gap:8px;font-size:.85rem;color:#5f6368;margin-top:12px}
p.sub{font-size:.85rem;color:#5f6368;margin-bottom:16px;line-height:1.45}
input[type=password],input[type=text]{width:100%;padding:12px;border:1.5px solid #dadce0;border-radius:8px;font-size:1rem;outline:none}
input:focus{border-color:#1a73e8;box-shadow:0 0 0 3px rgba(26,115,232,.2)}
button,a.btn{display:inline-flex;align-items:center;justify-content:center;padding:11px 16px;border-radius:8px;border:1px solid #dadce0;background:#fff;color:#3c4043;font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none}
button.primary{background:#1a73e8;color:#fff;border-color:transparent;width:100%;margin-top:12px}
.err{background:#fce8e6;color:#d93025;padding:8px 10px;border-radius:6px;font-size:.82rem;margin-top:10px;display:none}
.res{display:none;margin-top:16px;background:#eef3fc;border:1px solid #cce0ff;border-radius:10px;padding:12px}
.res .n{font-weight:700;margin-bottom:6px}
.res .l{font-size:.68rem;font-weight:700;text-transform:uppercase;color:#1557b0;letter-spacing:.5px}
.res .u{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;color:#1a73e8;word-break:break-all;margin:4px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
ol{font-size:.82rem;color:#5f6368;margin:14px 0 0 18px;line-height:1.6}
#app{display:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e8e3e;color:#fff;padding:10px 18px;border-radius:8px;font-size:.88rem;display:none}
.pwa{display:none;position:fixed;left:12px;right:12px;bottom:12px;max-width:460px;margin:0 auto;background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.25);padding:14px;align-items:center;gap:12px;z-index:9999;flex-wrap:wrap}
.pwa img{width:44px;height:44px;object-fit:contain}
.pwa .t{flex:1;min-width:140px;font-size:.85rem;color:#5f6368;line-height:1.4}
.pwa .t b{display:block;color:#202124;font-size:.95rem}
.pwa .pb{display:flex;gap:8px}
.pwa button.primary{width:auto;margin:0}
button.pwa-btn{display:none;position:fixed;top:12px;right:12px;z-index:9998;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;background:#1a73e8;color:#fff;border:none;font-size:.85rem;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.nfcs{display:none;font-size:.82rem;color:#3c4043;margin-bottom:8px;line-height:1.4}
button.nfcbtn{width:100%;margin-top:8px;background:#1e8e3e;color:#fff;border-color:transparent}
button.nfcbtn:active{background:#187534}
.nfcm{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:center;justify-content:center;z-index:10000;padding:16px}
.nfcb{background:#fff;width:100%;max-width:340px;border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.3)}
.nfci{width:76px;height:76px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center}
.nfci.wait{background:#e8f0fe;color:#1a73e8;animation:nfcp 1.4s ease-in-out infinite}
.nfci.ok{background:#e6f4ea;color:#1e8e3e}
.nfci.bad{background:#fce8e6;color:#d93025}
@keyframes nfcp{0%{box-shadow:0 0 0 0 rgba(26,115,232,.45)}70%{box-shadow:0 0 0 22px rgba(26,115,232,0)}100%{box-shadow:0 0 0 0 rgba(26,115,232,0)}}
.nfcb h3{font-size:1.1rem;margin-bottom:6px}
.nfcb p{font-size:.88rem;color:#5f6368;line-height:1.45;margin-bottom:16px}
.nfcb button{width:100%}
</style>

<body>

</div>

<script>
// ===== CONFIG =====
const AUTH={
  remoteUrl:"https://raw.githubusercontent.com/playtiearngarden-bit/GOOG-REVIEW/refs/heads/main/credentials.json",
  useRemote:true,
  salt:"place_finder_salt_2024",
  hash:"3c3cb49b3c87f1b8f23edf8d6e305343c1fb11d331df3720978a276164870aa7"
};

//CORE-START
function sha256(m){
  const K=[],H=[];let p=0;
  for(let c=2;p<64;c++){let ok=true;for(let d=2;d*d<=c;d++)if(c%d===0){ok=false;break}
    if(ok){if(p<8)H[p]=Math.floor((Math.pow(c,.5)%1)*4294967296);K[p++]=Math.floor((Math.pow(c,1/3)%1)*4294967296)}}
  const by=Array.from(new TextEncoder().encode(m)),l=by.length*8;
  by.push(0x80);while(by.length%64!==56)by.push(0);
  for(let i=7;i>=0;i--)by.push(i>=4?0:(l>>>(i*8))&255);
  const rr=(x,n)=>(x>>>n)|(x<<(32-n));let h=H.slice();
  for(let o=0;o<by.length;o+=64){
    const w=[];for(let i=0;i<16;i++)w[i]=(by[o+4*i]<<24)|(by[o+4*i+1]<<16)|(by[o+4*i+2]<<8)|by[o+4*i+3];
    for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];
      w[i]=(w[i-16]+(rr(a,7)^rr(a,18)^(a>>>3))+w[i-7]+(rr(b,17)^rr(b,19)^(b>>>10)))|0}
    let [a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){
      const t1=(hh+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0;
      const t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
    const v=[a,b,c,d,e,f,g,hh];h=h.map((x,i)=>(x+v[i])|0)}
  return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('');
}
function toPlaceId(a,b){
  const buf=new Uint8Array(20);buf[0]=0x0A;buf[1]=0x12;buf[2]=0x09;buf[11]=0x11;
  const x=BigInt('0x'+a),y=BigInt('0x'+b);
  for(let i=0;i<8;i++){buf[3+i]=Number((x>>BigInt(8*i))&255n);buf[12+i]=Number((y>>BigInt(8*i))&255n)}
  return btoa(String.fromCharCode.apply(null,buf)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function parseInput(t){
  t=(t||'').trim();
  if(/^ChIJ[\w-]{10,}$/.test(t))return{id:t,name:'Place ID'};
  if(/^(https?:\/\/)?(maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(t))return{error:'Short links are not supported. Paste the full Google Maps link.'};
  let s=t;try{s=decodeURIComponent(t)}catch(e){}
  const pid=s.match(/ChIJ[\w-]{20,}/);if(pid)return{id:pid[0],name:'Selected place'};
  const m=s.match(/0x([0-9a-f]+):0x([0-9a-f]+)/i);
  if(!m)return{error:'No place found in that link. Use the full link of a specific place (business page).'};
  const n=s.match(/\/maps\/place\/([^\/@?]+)/);
  return{id:toPlaceId(m[1],m[2]),name:n?n[1].replace(/\+/g,' '):'Selected place'};
}
//CORE-END

const $=id=>document.getElementById(id);
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2000)}
async function hashOf(s){
  try{if(window.crypto&&crypto.subtle){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('')}}catch(e){}
  return sha256(s);
}
async function creds(){
  if(AUTH.useRemote&&AUTH.remoteUrl){
    try{const c=new AbortController();setTimeout(()=>c.abort(),4000);
      const r=await fetch(AUTH.remoteUrl+'?_='+Date.now(),{signal:c.signal});
      if(r.ok){const j=await r.json();if(j&&j.hash)return{salt:j.salt||AUTH.salt,hash:j.hash}}}catch(e){}
  }
  return{salt:AUTH.salt,hash:AUTH.hash};
}
async function login(){
  const pw=$('pw').value.trim();if(!pw)return;
  const c=await creds();
  if((await hashOf(c.salt+':'+pw)).toLowerCase()===c.hash.toLowerCase()){
    try{if($('save').checked)localStorage.setItem('placeid_pwd',pw);else localStorage.removeItem('placeid_pwd')}catch(e){}
    $('login').style.display='none';$('app').style.display='block';
  }else{$('lerr').style.display='block';$('pw').select()}
}
async function copy(t,l){
  try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(t);
    else{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.left='-9999px';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
    toast(l+' copied!')}catch(e){toast('Copy failed')}
}
let cur=null;
function go(){
  let r=parseInput($('url').value);
  if(r.error){$('uerr').textContent=r.error;$('uerr').style.display='block';$('res').style.display='none';return}
  $('uerr').style.display='none';cur=r;
  const u='search.google.com/local/writereview?placeid='+r.id;
  $('rname').textContent=r.name;$('rurl').textContent=u;$('open').href='https://'+u;$('res').style.display='block';
}
try{const sp=localStorage.getItem('placeid_pwd');if(sp)$('pw').value=sp}catch(e){}
$('unlock').onclick=login;
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('go').onclick=go;
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
$('url').addEventListener('paste',()=>setTimeout(go,50));
const NFC_ICO={
  wait:'<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8.3a6.3 6.3 0 0 1 0 7.4"/><path d="M9.5 5.5a10.5 10.5 0 0 1 0 13"/><path d="M13 3a14.5 14.5 0 0 1 0 18"/></svg>',
  ok:'<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  bad:'<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg>'
};
let nfcAc=null,nfcCancelled=false;
function nfcShow(kind,title,text,btn){
  $('nfci').className='nfci '+kind;$('nfci').innerHTML=NFC_ICO[kind];
  $('nfct').textContent=title;$('nfcp').textContent=text;$('nfcx').textContent=btn;
  $('nfcm').style.display='flex';
}
function nfcClose(){
  if(nfcAc){nfcCancelled=true;nfcAc.abort();nfcAc=null}
  $('nfcm').style.display='none';
}
async function nfcWrite(){
  if(!cur)return;
  const url='https://search.google.com/local/writereview?placeid='+cur.id;
  if(!('NDEFReader' in window)){
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    copy(url,'Review link');
    nfcShow('bad','Cannot write from here',ios
      ?'iPhone cannot write NFC tags from a web page. The review link was copied: open an NFC app (for example NFC Tools), choose Write > Add a record > URL, paste it and tap Write.'
      :'This browser cannot write NFC tags. The review link was copied. Use Chrome on Android, or paste it into an NFC writer app.','Close');
    return;
  }
  nfcCancelled=false;
  const ac=new AbortController();nfcAc=ac;
  const timer=setTimeout(()=>ac.abort(),30000);
  nfcShow('wait','Waiting for NFC tag...','Hold the back of your phone against the NFC tag and keep it still.','Cancel');
  try{
    await new NDEFReader().write({records:[{recordType:'url',data:url}]},{signal:ac.signal});
    clearTimeout(timer);nfcAc=null;
    nfcShow('ok','Tag written!','The NFC tag now opens this review link.','Done');
  }catch(e){
    clearTimeout(timer);nfcAc=null;
    if(e.name==='AbortError'&&nfcCancelled){$('nfcm').style.display='none';return}
    nfcShow('bad',e.name==='AbortError'?'Timed out':'Could not write the tag',
      e.name==='NotAllowedError'?'NFC permission was denied, or NFC is turned off in your phone settings.':
      e.name==='AbortError'?'No tag was found in 30 seconds. Try again.':
      (e.message||e.name),'Close');
  }
}
$('nfc').onclick=nfcWrite;
$('nfcx').onclick=nfcClose;
$('cpl').onclick=()=>cur&&copy('search.google.com/local/writereview?placeid='+cur.id,'Review link');
</script>
<script>
// ===== Install as app (PWA) =====
document.querySelectorAll('img[data-logo]').forEach(function(i){i.src=window.LOGO});
(function(){
  const $=id=>document.getElementById(id);
  const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  if(standalone){set('pwa_installed','1');return}          // inside the installed app: no button, no popup
  if(!/^https?:$/.test(location.protocol))return;           // cannot install from a local file
  $('pwaBtn').style.display='flex';                         // always visible in the browser
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const d=parseInt(get('pwa_dismissed')||'0',10);
  const quiet=(d&&Date.now()-d<7*864e5)||get('pwa_installed');
  let dp=null;
  const hide=()=>{$('pwa').style.display='none'};
  const show=()=>{$('pwa').style.display='flex'};
  const info=()=>{
    $('pwaMsg').innerHTML=ios?'Tap the <b style="display:inline">Share</b> button (square with arrow), then <b style="display:inline">Add to Home Screen</b>.':'Open your browser menu (\u22EE) and tap <b style="display:inline">Install app</b> or <b style="display:inline">Add to Home screen</b>.';
    $('pwaYes').style.display='none';$('pwaNo').textContent='Got it';show();
  };
  const offer=()=>{$('pwaMsg').textContent='Add it to your home screen for quick access.';$('pwaYes').style.display='';$('pwaNo').textContent='Not now';show()};
  const install=async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice}catch(e){}dp=null;hide()};
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(!quiet)setTimeout(offer,800)});
  window.addEventListener('appinstalled',()=>{set('pwa_installed','1');hide()});
  if(ios&&!quiet)setTimeout(info,1200);
  $('pwaBtn').onclick=()=>{if(dp)install();else info()};
  $('pwaYes').onclick=install;
  $('pwaNo').onclick=()=>{set('pwa_dismissed',String(Date.now()));hide()};
})();
</script>
